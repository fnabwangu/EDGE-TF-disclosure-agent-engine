[project]
name = "edge-tf-core"
version = "0.1.0"
description = "EDGE-TF disclosure agent engine - scaffold"
dependencies = [
    "numpy>=1.25",
    "pandas>=2.2",
    "networkx>=3.0",
    "scipy>=1.11",
    "cvxpy>=1.4",
    "pydantic>=2.0",
    "jsonschema>=4.20",
    "streamlit>=1.24",
    "requests>=2.30",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "openai>=1.50"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
